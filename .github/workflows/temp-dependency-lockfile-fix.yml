name: Temporary dependency lockfile security refresh

on:
  push:
    branches:
      - chore/dependency-security-2026-09-30
    paths:
      - .github/workflows/temp-dependency-lockfile-fix.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825fa76410c181273ba90b1 # v7.0.1
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify high severity gate
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh vulnerable transitive dependencies"
          git push
