name: V02-003 Lockfile Sync

on:
  push:
    branches:
      - feature/v02-003-api-security-baseline

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/v02-003-api-security-baseline

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit de lockfile si cambió
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json ya estaba sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincroniza lockfile de seguridad API"
          git push origin HEAD:feature/v02-003-api-security-baseline
