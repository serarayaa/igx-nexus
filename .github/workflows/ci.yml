name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Contracts / API / Design System / Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de seguridad
        run: npm audit --audit-level=high

      - name: Validar contratos canónicos v0.2
        run: |
          npm run typecheck --workspace @igx-nexus/types
          npm run test --workspace @igx-nexus/types
          npm run build --workspace @igx-nexus/types
          npm pack --dry-run --workspace @igx-nexus/types

      - name: Validar NEXUS API Runtime
        run: |
          npm run typecheck --workspace @igx-nexus/api
          npm run test --workspace @igx-nexus/api
          npm run build --workspace @igx-nexus/api
          npm pack --dry-run --workspace @igx-nexus/api

      - name: Validar sintaxis del preflight GLPI Agent
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/live-lab/Test-GlpiAgentPreflight.ps1',
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validar sintaxis del probe Windows / Dell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/live-lab/Test-WindowsDellTelemetry.ps1',
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Instalar Chromium para tests de UI
        run: |
          # Chromium de Playwright no depende del repositorio Google Chrome que trae el runner.
          # Los runners pueden declararlo como .list o .sources; eliminar sólo los archivos
          # que referencian ese repositorio evita que una desincronización externa bloquee apt.
          grep -rlZ 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list.d 2>/dev/null \
            | xargs -0 -r sudo rm -f
          npx playwright install --with-deps chromium

      - name: Typecheck de tokens y UI
        run: npm run typecheck --workspace @igx-nexus/ui

      - name: Build de tokens y UI
        run: npm run build --workspace @igx-nexus/ui

      - name: Build estático de Storybook
        run: npm run storybook:build --workspace @igx-nexus/ui

      - name: Tests de Storybook en Chromium
        run: npm run test:storybook --workspace @igx-nexus/ui

      - name: Verificar tokens generados versionados
        run: git diff --exit-code -- packages/ui/generated

      - name: Verificar paquete distribuible
        run: npm pack --dry-run --workspace @igx-nexus/ui

      - name: Typecheck y build del Dashboard
        run: npm run build --workspace @igx-nexus/web

      - name: "Tests Web: modelo, interacción, accesibilidad y Demo v0.1"
        run: npm run test --workspace @igx-nexus/web

      - name: Verificar diff de trabajo
        run: git diff --check

      - name: Reflow, High Contrast y reduced motion de CMDB Health
        run: node scripts/qa-cmdb-health.mjs

      - name: Evidencia visual CMDB Health
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmdb-health-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
